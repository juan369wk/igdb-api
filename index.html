<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Stash Minimal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-cardbg/50 backdrop-blur sticky top-0 z-20">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
                🎮 <span class="bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">GameStash</span>
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="openConfigModal()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg border border-slate-700 transition">
                    ⚙️ Configurar Cloud
                </button>
                <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg shadow-indigo-600/20 transition">
                    + Añadir Juego
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Filtros y Buscador local -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
            <input type="text" id="searchInput" oninput="filterGames()" placeholder="Filtrar mi lista..." 
                class="bg-cardbg border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 flex-grow">
            
            <select id="statusFilter" onchange="filterGames()" class="bg-cardbg border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                <option value="ALL">Todos los estados</option>
                <option value="Jugando">Jugando</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Completado">Completado</option>
                <option value="Abandonado">Abandonado</option>
            </select>
        </div>

        <!-- Grid de Juegos -->
        <div id="gamesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Se carga dinámicamente -->
        </div>
    </main>

    <!-- MODAL: Añadir / Buscar en IGDB -->
    <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-cardbg border border-slate-700 w-full max-w-lg rounded-2xl p-6 max-h-[90vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Añadir Juego</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            
            <!-- Buscador IGDB -->
            <div class="space-y-3 mb-4">
                <label class="text-xs text-slate-400">Buscar en IGDB</label>
                <div class="flex gap-2">
                    <input type="text" id="igdbQuery" placeholder="Ej. Hollow Knight..." 
                        class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm flex-grow focus:outline-none focus:border-indigo-500">
                    <button onclick="searchIGDB()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm border border-slate-700 transition">Buscar</button>
                </div>
            </div>

            <!-- Resultados de búsqueda -->
            <div id="searchResults" class="overflow-y-auto max-h-60 space-y-2 mb-4 pr-1 flex-grow">
                <p class="text-xs text-slate-500 text-center py-4">Busca un juego para seleccionarlo</p>
            </div>

            <!-- Formulario de detalles del juego seleccionado -->
            <div id="gameForm" class="hidden space-y-3 border-t border-slate-700 pt-4">
                <input type="hidden" id="selectedTitle">
                <input type="hidden" id="selectedCover">
                
                <div class="flex items-center gap-3 bg-slate-900/50 p-2 rounded-lg">
                    <img id="previewCover" src="" class="w-12 h-16 object-cover rounded">
                    <div>
                        <h4 id="previewTitle" class="text-sm font-bold text-white"></h4>
                        <span id="previewPlatforms" class="text-xs text-slate-400"></span>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">Estado</label>
                    <select id="gameStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                        <option value="Pendiente">Pendiente</option>
                        <option value="Jugando">Jugando</option>
                        <option value="Completado">Completado</option>
                        <option value="Abandonado">Abandonado</option>
                    </select>
                </div>

                <button onclick="saveGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-sm transition shadow-lg shadow-indigo-600/20">
                    Guardar en la Nube
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: Configurar Credenciales de JSONBin -->
    <div id="configModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-cardbg border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Configuración Cloud (JSONBin)</h3>
                <button onclick="closeConfigModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <p class="text-xs text-slate-400 mb-4">Introduce tus credenciales de JSONBin.io para sincronizar el PC y el móvil.</p>
            
            <div class="space-y-3 mb-4">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Bin ID</label>
                    <input type="text" id="binIdInput" placeholder="Ej. 65f1a23..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Master Key ($2a$10$...)</label>
                    <input type="password" id="binKeyInput" placeholder="Ej. $2a$10$..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">URL de tu función Serverless (IGDB Search)</label>
                    <input type="text" id="apiUrlInput" placeholder="https://tu-proyecto.vercel.app/api/search-game" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                </div>
            </div>
            <button onclick="saveConfig()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-sm transition">
                Guardar Configuración
            </button>
        </div>
    </div>

    <!-- Script de lógica -->
    <script>
        let games = [];
        let CONFIG = {
            binId: localStorage.getItem('stash_binId') || '',
            binKey: localStorage.getItem('stash_binKey') || '',
            apiUrl: localStorage.getItem('stash_apiUrl') || ''
        };

        window.onload = () => {
            if (CONFIG.binId && CONFIG.binKey) {
                fetchGames();
            } else {
                openConfigModal();
            }
        };

        function openConfigModal() {
            document.getElementById('binIdInput').value = CONFIG.binId;
            document.getElementById('binKeyInput').value = CONFIG.binKey;
            document.getElementById('apiUrlInput').value = CONFIG.apiUrl;
            document.getElementById('configModal').classList.remove('hidden');
            document.getElementById('configModal').classList.add('flex');
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.remove('flex');
            document.getElementById('configModal').classList.add('hidden');
        }

        function saveConfig() {
            CONFIG.binId = document.getElementById('binIdInput').value.trim();
            CONFIG.binKey = document.getElementById('binKeyInput').value.trim();
            CONFIG.apiUrl = document.getElementById('apiUrlInput').value.trim();

            localStorage.setItem('stash_binId', CONFIG.binId);
            localStorage.setItem('stash_binKey', CONFIG.binKey);
            localStorage.setItem('stash_apiUrl', CONFIG.apiUrl);

            closeConfigModal();
            fetchGames();
        }

        async function fetchGames() {
            if (!CONFIG.binId) return;
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}/latest`, {
                    headers: { 'X-Master-Key': CONFIG.binKey }
                });
                const data = await res.json();
                games = data.record.games || [];
                renderGames(games);
            } catch (err) {
                console.error("Error cargando juegos:", err);
            }
        }

        async function syncCloud() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': CONFIG.binKey
                    },
                    body: JSON.stringify({ games })
                });
            } catch (err) {
                console.error("Error sincronizando con la nube:", err);
                alert("Error al guardar en la nube");
            }
        }

        function renderGames(list) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10 text-sm">No hay juegos en tu lista. ¡Añade el primero!</p>`;
                return;
            }

            list.forEach((game, index) => {
                grid.innerHTML += `
                    <div class="bg-cardbg border border-slate-800 rounded-xl overflow-hidden flex flex-col group shadow-md">
                        <div class="relative aspect-[3/4] bg-slate-900 overflow-hidden">
                            <img src="${game.cover}" alt="${game.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <span class="absolute top-2 right-2 text-[10px] font-semibold px-2 py-0.5 rounded-full backdrop-blur-md bg-black/60 text-white border border-white/10">
                                ${game.status}
                            </span>
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-grow">
                            <h3 class="text-xs font-bold line-clamp-2 mb-2 text-slate-200">${game.title}</h3>
                            <div class="flex justify-between items-center mt-auto">
                                <span class="text-[10px] text-slate-500 truncate max-w-[100px]">${game.platforms ? game.platforms[0] : ''}</span>
                                <button onclick="deleteGame(${game.id})" class="text-slate-500 hover:text-red-400 text-xs transition">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            const filtered = games.filter(g => {
                const matchQuery = g.title.toLowerCase().includes(query);
                const matchStatus = (status === 'ALL' || g.status === status);
                return matchQuery && matchStatus;
            });
            renderGames(filtered);
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('addModal').classList.add('flex');
            document.getElementById('searchResults').innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Busca un juego para seleccionarlo</p>';
            document.getElementById('gameForm').classList.add('hidden');
            document.getElementById('igdbQuery').value = '';
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('flex');
            document.getElementById('addModal').classList.add('hidden');
        }

        async function searchIGDB() {
            const query = document.getElementById('igdbQuery').value.trim();
            if (!query || !CONFIG.apiUrl) {
                alert('Introduce un término de búsqueda y asegúrate de configurar la URL de tu API.');
                return;
            }

            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Buscando en IGDB...</p>';

            try {
                const res = await fetch(`${CONFIG.apiUrl}?query=${encodeURIComponent(query)}`);
                const results = await res.json();

                if (results.length === 0) {
                    resultsDiv.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">No se encontraron juegos.</p>';
                    return;
                }

                resultsDiv.innerHTML = '';
                results.forEach(game => {
                    resultsDiv.innerHTML += `
                        <div onclick='selectGame(${JSON.stringify(game).replace(/'/g, "&#39;")})' class="flex items-center gap-3 p-2 hover:bg-slate-800/80 rounded-lg cursor-pointer transition border border-transparent hover:border-slate-700">
                            <img src="${game.cover}" class="w-10 h-14 object-cover rounded">
                            <div>
                                <h4 class="text-xs font-bold text-white">${game.name}</h4>
                                <span class="text-[10px] text-slate-400">${game.platforms.join(', ')}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                resultsDiv.innerHTML = '<p class="text-xs text-red-400 text-center py-4">Error al buscar en IGDB.</p>';
            }
        }

        function selectGame(game) {
            document.getElementById('selectedTitle').value = game.name;
            document.getElementById('selectedCover').value = game.cover;
            
            document.getElementById('previewCover').src = game.cover;
            document.getElementById('previewTitle').innerText = game.name;
            document.getElementById('previewPlatforms').innerText = game.platforms.join(', ');

            document.getElementById('gameForm').classList.remove('hidden');
        }

        async function saveGame() {
            const newGame = {
                id: Date.now(),
                title: document.getElementById('selectedTitle').value,
                cover: document.getElementById('selectedCover').value,
                status: document.getElementById('gameStatus').value,
                platforms: [document.getElementById('previewPlatforms').innerText]
            };

            games.unshift(newGame);
            await syncCloud();
            renderGames(games);
            closeAddModal();
        }

        async function deleteGame(id) {
            if (confirm('¿Eliminar este juego de tu lista?')) {
                games = games.filter(g => g.id !== id);
                await syncCloud();
                renderGames(games);
            }
        }
    </script>
</body>
</html>
